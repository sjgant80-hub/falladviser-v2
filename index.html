<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>£ FallAdviser v2 · sovereign multi-client UK financial advice · tax · pension · portfolio · suitability</title>
<meta name="description" content="Sovereign multi-client UK financial-advice tool for IFA firms. Multi-adviser, multi-client, scenarios, suitability, CGT lots, Bed&ISA, withdrawal sequencing, marriage allowance, HICBC, carry-forward, tapered AA, BPR/APR, Scotland bands. Informational, not regulated advice.">
<meta name="prime" content="719">
<meta name="version" content="2.0.0">
<meta name="theme-color" content="#0b0a0f">

<style>
:root{
 --void:#0b0a0f;--void-2:#13121a;--ink:#1a1922;--ink-2:#22212c;
 --line:#2a2934;--line-soft:#1f1e28;
 --cream:#e6e1d6;--cream-dim:#a8a395;--cream-muted:#6e6a5e;
 --brass:#b8974a;--amber:#ff8c00;--ox:#8b1a1a;
 --green:#4ade80;--red:#ef4444;--blue:#60a5fa;--yellow:#fbbf24;--knowledge:#3F6C8E;
 --serif:Georgia,'Libre Baskerville',ui-serif,serif;
 --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
 --mono:'IBM Plex Mono','SF Mono',ui-monospace,Menlo,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--void);color:var(--cream);font:14px/1.55 var(--sans);min-height:100dvh;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;background:transparent;border:none;color:inherit}
input,textarea,select{font-family:inherit;background:var(--ink);border:1px solid var(--line);color:var(--cream);border-radius:3px;padding:7px 10px;outline:none;font-size:13px}
input:focus,textarea:focus,select:focus{border-color:var(--brass)}
input[type=number]{font-family:var(--mono)}
a{color:var(--brass)}a:hover{color:var(--amber)}

.app{min-height:100dvh;display:grid;grid-template-rows:48px 1fr}
header{display:flex;align-items:center;border-bottom:1px solid var(--line);background:var(--void-2);user-select:none}
.brand{display:flex;align-items:center;gap:10px;padding:0 16px;height:100%;border-right:1px solid var(--line)}
.brand .mark{width:28px;height:28px;background:linear-gradient(135deg,var(--brass),var(--amber));border-radius:5px;display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:16px;color:var(--void)}
.brand .name{font-family:var(--serif);font-weight:600;font-size:14px;letter-spacing:0.02em}
.brand .seal{font-family:var(--mono);font-size:9px;color:var(--cream-muted);letter-spacing:0.18em;text-transform:uppercase}

.client-pill{display:flex;align-items:center;gap:8px;padding:0 14px;height:100%;border-right:1px solid var(--line);cursor:pointer;font-size:12px;color:var(--cream-dim)}
.client-pill:hover{background:var(--ink);color:var(--cream)}
.client-pill .who{font-family:var(--serif);font-size:13px;color:var(--brass)}
.client-pill .meta{font-family:var(--mono);font-size:9px;color:var(--cream-muted);letter-spacing:0.1em;text-transform:uppercase}

nav.tabs{display:flex;flex:1;overflow-x:auto;align-items:stretch}
nav.tabs button{padding:0 14px;font-size:12px;color:var(--cream-dim);letter-spacing:0.04em;display:flex;align-items:center;gap:6px;border-right:1px solid var(--line-soft);height:100%;white-space:nowrap;border-top:2px solid transparent}
nav.tabs button:hover{background:var(--ink);color:var(--cream)}
nav.tabs button.active{background:var(--ink);color:var(--brass);border-top-color:var(--brass)}

.tools-r{display:flex;align-items:center;gap:5px;padding:0 14px;height:100%;border-left:1px solid var(--line)}
.tool-btn{padding:5px 11px;border-radius:3px;font-size:11px;color:var(--cream-dim);letter-spacing:0.06em;text-transform:uppercase;font-family:var(--mono);border:1px solid var(--line)}
.tool-btn:hover{background:var(--ink);color:var(--cream);border-color:var(--brass)}
.tool-btn.primary{background:var(--brass);color:var(--void);border-color:var(--brass);font-weight:600}
.tool-btn.primary:hover{background:var(--amber);border-color:var(--amber)}
.tool-btn.t3{border-color:var(--blue);color:var(--blue)}

.layout{display:grid;grid-template-columns:280px 1fr;min-height:calc(100dvh - 48px)}
aside.sidebar{background:var(--void-2);border-right:1px solid var(--line);overflow-y:auto;padding:14px 12px 60px;display:flex;flex-direction:column;gap:10px}
.sidebar h4{font-family:var(--mono);font-size:10px;color:var(--brass);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:6px;padding:0 4px}
.sidebar-search{display:flex;flex-direction:column;gap:6px}
.sidebar-search input,.sidebar-search select{font-size:12px;padding:6px 8px}
.client-list{display:flex;flex-direction:column;gap:3px}
.client-card{padding:9px 11px;border-radius:3px;cursor:pointer;border:1px solid transparent;border-left:3px solid var(--line);background:var(--ink);transition:all 0.1s}
.client-card:hover{background:var(--ink-2);border-left-color:var(--brass)}
.client-card.active{background:var(--ink-2);border-left-color:var(--brass);border-color:var(--line)}
.client-card .nm{font-family:var(--serif);font-size:13px;color:var(--cream);font-weight:600}
.client-card .sub{font-family:var(--mono);font-size:10px;color:var(--cream-muted);letter-spacing:0.06em;margin-top:2px;display:flex;gap:6px;flex-wrap:wrap}
.client-card .sub .tag{padding:1px 5px;border-radius:2px;background:var(--void);color:var(--cream-dim);font-size:9px}
.client-card .sub .tag.due{background:var(--ox);color:var(--cream)}
.client-card .sub .tag.atr{color:var(--brass);border:1px solid var(--line)}
.empty-state{padding:18px;text-align:center;color:var(--cream-muted);font-size:12px;font-style:italic}

main{padding:18px 22px 60px;overflow-y:auto;max-width:1240px;margin:0 auto;width:100%}

.disclaimer{background:rgba(139,26,26,0.15);border:1px solid var(--ox);border-left:3px solid var(--ox);border-radius:3px;padding:12px 16px;margin-bottom:18px;font-size:12px;color:var(--cream)}
.disclaimer strong{color:var(--brass)}

.section-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;gap:14px;flex-wrap:wrap}
.section-h h2{font-family:var(--serif);font-size:18px;font-weight:600;letter-spacing:0.01em}
.section-h .sub{font-family:var(--mono);font-size:11px;color:var(--cream-muted);letter-spacing:0.08em;text-transform:uppercase}
.section-h .actions{display:flex;gap:6px;flex-wrap:wrap}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.card{background:var(--void-2);border:1px solid var(--line);border-radius:4px;padding:16px 18px}
.card h3{font-family:var(--serif);font-size:14px;font-weight:600;margin-bottom:10px;color:var(--cream);letter-spacing:0.01em}
.card h3 .meta{font-family:var(--mono);font-size:10px;color:var(--brass);letter-spacing:0.1em;margin-left:8px}

.kpi{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line-soft);font-size:13px}
.kpi:last-child{border-bottom:none}
.kpi .l{color:var(--cream-dim)}
.kpi .v{font-family:var(--mono);color:var(--cream);font-weight:500}
.kpi .v.green{color:var(--green)}.kpi .v.red{color:var(--red)}.kpi .v.amber{color:var(--amber)}.kpi .v.brass{color:var(--brass)}.kpi .v.blue{color:var(--blue)}

.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.row.r3{grid-template-columns:1fr 1fr 1fr}
.field label{display:block;font-family:var(--mono);font-size:10px;color:var(--cream-muted);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:3px}
.field input,.field select,.field textarea{width:100%}
.field .hint{font-size:10px;color:var(--cream-muted);margin-top:3px;font-family:var(--mono)}

.btn{padding:7px 14px;border:1px solid var(--brass);border-radius:3px;font-size:12px;color:var(--cream);background:transparent;letter-spacing:0.04em;cursor:pointer}
.btn:hover{border-color:var(--amber);color:var(--amber)}
.btn.primary{background:var(--brass);color:var(--void);border-color:var(--brass);font-weight:600}
.btn.primary:hover{background:var(--amber);border-color:var(--amber);color:var(--void)}
.btn.danger{border-color:var(--ox);color:var(--ox)}
.btn.danger:hover{border-color:var(--red);color:var(--red);background:rgba(239,68,68,0.08)}
.btn.sm{padding:4px 9px;font-size:11px}
.btn.ghost{border-color:var(--line);color:var(--cream-dim)}
.btn.ghost:hover{border-color:var(--brass);color:var(--brass)}

table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line-soft);text-align:left}
th{color:var(--brass);font-family:var(--mono);font-size:10px;letter-spacing:0.08em;text-transform:uppercase;font-weight:600}
td.r{text-align:right;font-family:var(--mono)}
tr.total td{font-weight:600;border-top:1px solid var(--brass);border-bottom:none;padding-top:10px}
tr.total td.r{color:var(--brass)}
tr.clickable{cursor:pointer}
tr.clickable:hover{background:var(--ink)}

.bar{height:6px;background:var(--ink);border-radius:3px;overflow:hidden;margin:6px 0}
.bar > div{height:100%;background:var(--brass);transition:width 0.3s}
.bar > div.green{background:var(--green)}.bar > div.red{background:var(--red)}.bar > div.amber{background:var(--amber)}.bar > div.blue{background:var(--blue)}

.tag{display:inline-block;padding:2px 7px;border-radius:11px;font-family:var(--mono);font-size:10px;letter-spacing:0.06em;text-transform:uppercase;border:1px solid var(--brass);color:var(--brass);margin-right:4px}
.tag.amber{border-color:var(--amber);color:var(--amber)}
.tag.green{border-color:var(--green);color:var(--green)}
.tag.red{border-color:var(--red);color:var(--red)}
.tag.blue{border-color:var(--blue);color:var(--blue)}
.tag.dim{border-color:var(--line);color:var(--cream-muted)}

.chat{display:flex;flex-direction:column;gap:10px;max-height:60vh;overflow-y:auto;padding:6px}
.msg{padding:10px 14px;border-radius:6px;max-width:88%;font-size:13px;line-height:1.55;white-space:pre-wrap}
.msg.user{background:var(--ink);align-self:flex-end;border-bottom-right-radius:2px}
.msg.bot{background:var(--void-2);border:1px solid var(--line);border-left:2px solid var(--brass);align-self:flex-start;border-bottom-left-radius:2px}
.msg.bot .src{font-family:var(--mono);font-size:10px;color:var(--cream-muted);letter-spacing:0.08em;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
.chat-input{display:flex;gap:8px;margin-top:10px}
.chat-input input{flex:1;padding:11px 14px}

.sug{padding:10px 13px;background:var(--ink);border-radius:3px;border-left:3px solid var(--brass);margin-bottom:6px;font-size:13px}
.sug .prio{font-family:var(--mono);font-size:10px;color:var(--brass);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:3px}
.sug.high{border-left-color:var(--green)}.sug.high .prio{color:var(--green)}
.sug.med{border-left-color:var(--amber)}.sug.med .prio{color:var(--amber)}
.sug.low{border-left-color:var(--cream-dim)}
.sug .why{font-size:11px;color:var(--cream-dim);margin-top:4px;font-style:italic}

.hold-row{display:grid;grid-template-columns:1.4fr 0.9fr 1fr 1fr 0.9fr 0.9fr 32px;gap:6px;padding:7px 0;border-bottom:1px solid var(--line-soft);align-items:center}
.hold-row.head{font-family:var(--mono);font-size:10px;color:var(--brass);letter-spacing:0.08em;text-transform:uppercase;border-bottom:1px solid var(--line)}
.hold-row input,.hold-row select{padding:5px 7px;font-size:12px;width:100%}
.hold-row .x{cursor:pointer;color:var(--cream-muted);font-family:var(--mono);text-align:center}
.hold-row .x:hover{color:var(--red)}

.lot-row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 32px;gap:6px;padding:5px 0;border-bottom:1px dashed var(--line-soft);align-items:center;font-size:12px}
.lot-row.head{font-family:var(--mono);font-size:9px;color:var(--brass);letter-spacing:0.08em;text-transform:uppercase}

.palette-bg,.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;align-items:flex-start;justify-content:center;padding-top:14vh;z-index:900;backdrop-filter:blur(4px)}
.palette-bg.open,.modal-bg.open{display:flex}
.modal-bg{align-items:center;padding:18px}
.palette{background:var(--void-2);border:1px solid var(--brass);border-radius:5px;width:min(640px,90%);box-shadow:0 18px 50px rgba(0,0,0,0.7);overflow:hidden}
.palette-hd{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.palette-hd .glyph{font-family:var(--serif);font-size:18px;color:var(--brass)}
.palette-hd input{flex:1;border:none;background:transparent;font-size:15px;padding:4px}
.palette-bd{max-height:50vh;overflow:auto;padding:8px}
.palette-row{padding:9px 12px;border-radius:3px;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:13px}
.palette-row:hover{background:var(--ink)}
.modal{background:var(--void-2);border:1px solid var(--brass);border-radius:4px;padding:22px;max-width:680px;width:100%;max-height:90vh;overflow:auto}
.modal h2{font-family:var(--serif);font-size:17px;margin-bottom:14px}
.modal .actions{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--brass);color:var(--void);padding:9px 18px;border-radius:3px;font-family:var(--mono);font-size:11px;letter-spacing:0.06em;text-transform:uppercase;font-weight:700;opacity:0;transition:all 0.22s;z-index:1100;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.onboard{max-width:580px;margin:5vh auto;padding:36px 32px;background:var(--void-2);border:1px solid var(--brass);border-radius:6px}
.onboard h1{font-family:var(--serif);font-size:28px;color:var(--brass);margin-bottom:6px}
.onboard .lead{color:var(--cream-dim);margin-bottom:20px;font-size:13px}
.onboard .step{font-family:var(--mono);font-size:10px;color:var(--brass);letter-spacing:0.18em;text-transform:uppercase;margin-bottom:8px}

.likert{display:flex;gap:4px;margin-top:6px}
.likert button{flex:1;padding:7px;border:1px solid var(--line);border-radius:3px;font-size:11px;color:var(--cream-dim)}
.likert button:hover{border-color:var(--brass);color:var(--cream)}
.likert button.sel{background:var(--brass);color:var(--void);border-color:var(--brass);font-weight:600}

.scen-card{padding:12px 14px;background:var(--ink);border-radius:3px;border-left:3px solid var(--brass);margin-bottom:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
.scen-card:hover{background:var(--ink-2)}
.scen-card.cmp{border-left-color:var(--blue)}
.scen-card .nm{font-family:var(--serif);font-size:13px;color:var(--cream);font-weight:600}
.scen-card .sub{font-family:var(--mono);font-size:10px;color:var(--cream-muted);letter-spacing:0.06em;margin-top:3px}
.scen-card .ops{display:flex;gap:5px}

.drawer-toggle{display:none;padding:0 12px;height:100%;align-items:center;border-right:1px solid var(--line);cursor:pointer;color:var(--brass);font-size:18px}

@media (max-width:880px){
 .drawer-toggle{display:flex}
 .layout{grid-template-columns:1fr}
 aside.sidebar{position:fixed;top:48px;left:-300px;bottom:0;width:280px;z-index:50;transition:left 0.2s;box-shadow:0 0 30px rgba(0,0,0,0.6)}
 aside.sidebar.open{left:0}
 nav.tabs button{padding:0 10px;font-size:11px}
 main{padding:14px 14px 50px}
 .row,.row.r3{grid-template-columns:1fr}
 .hold-row{grid-template-columns:1fr 1fr;gap:4px}
 .hold-row.head{display:none}
 .brand .seal{display:none}
}
</style>
</head>
<body>

<div class="app">
<header>
 <button class="drawer-toggle" onclick="toggleDrawer()" title="clients">☰</button>
 <div class="brand">
 <div class="mark">£</div>
 <div>
 <div class="name">FallAdviser</div>
 <div class="seal">v2 · prime 719 · IFA</div>
 </div>
 </div>
 <div class="client-pill" id="clientPill" onclick="showApp('clients')" title="active client">
 <span class="who" id="cpWho">— no client —</span>
 <span class="meta" id="cpMeta"></span>
 </div>
 <nav class="tabs" id="tabNav"></nav>
 <div class="tools-r">
 <button class="tool-btn primary" onclick="openPalette()" title="ask · Ctrl+K">◊ ask</button>
 <button class="tool-btn" id="tierBadge" onclick="openModal('settings')">T0</button>
 <button class="tool-btn" onclick="openModal('settings')">⚙</button>
 </div>
</header>

<div class="layout">
<aside class="sidebar" id="sidebar">
 <div class="sidebar-search">
 <h4>clients <span id="clientCount" style="float:right;color:var(--cream-muted);font-weight:normal"></span></h4>
 <input type="text" id="clientFilter" placeholder="search name · email · postcode" oninput="renderSidebar()">
 <div class="row" style="gap:4px;margin:0">
 <select id="clientFilterAdviser" onchange="renderSidebar()" style="font-size:11px"></select>
 <select id="clientFilterRisk" onchange="renderSidebar()" style="font-size:11px">
 <option value="">all risk</option><option value="low">low</option><option value="medium">medium</option><option value="high">high</option>
 </select>
 </div>
 <div class="row" style="gap:4px;margin:0">
 <select id="clientFilterATR" onchange="renderSidebar()" style="font-size:11px">
 <option value="">all ATR</option>
 <option value="1">ATR 1</option><option value="2">ATR 2</option><option value="3">ATR 3</option>
 <option value="4">ATR 4</option><option value="5">ATR 5</option><option value="6">ATR 6</option><option value="7">ATR 7</option>
 </select>
 <select id="clientFilterDue" onchange="renderSidebar()" style="font-size:11px">
 <option value="">all reviews</option><option value="due">due / overdue</option><option value="ok">in window</option>
 </select>
 </div>
 <button class="btn sm primary" onclick="newClient()" style="width:100%;margin-top:4px">+ new client</button>
 </div>
 <div class="client-list" id="clientList"></div>
</aside>
<main id="view"></main>
</div>
</div>

<div class="palette-bg" id="palette">
 <div class="palette">
 <div class="palette-hd">
 <span class="glyph">£</span>
 <input type="text" id="pInput" placeholder="ask · 'CGT if Alice sells £15k of VWRL · scenarios for Bob · marriage allowance · HICBC at £72k'">
 <span id="pTier" style="font-family:var(--mono);font-size:10px;color:var(--cream-muted)">T0</span>
 </div>
 <div class="palette-bd" id="pBody"></div>
 </div>
</div>

<div class="modal-bg" id="modal">
 <div class="modal">
 <h2 id="modalTitle">·</h2>
 <div id="modalBody"></div>
 </div>
</div>

<div class="toast" id="toast">·</div>

<script>
'use strict';

// ════════════════════════════════════════════════════════════════
// FallAdviser v2 · sovereign multi-client UK financial advice
// prime 719 · v20.4 socket compliant · MIT · 2025-26 tax year
// IFA-bundle tool · shared client schema · BroadcastChannel mesh
// INFORMATIONAL · NOT REGULATED FCA ADVICE
// ════════════════════════════════════════════════════════════════
const TOOLNAME='falladviser';const VERSION='2.0.0';const PRIME=719;const STORE='falladviser-v2';const CONFIG_V='falladviser@'+VERSION;
const TAX_YEAR='2025-26';

const RULES={
 taxYear:TAX_YEAR,
 personalAllowance:12570,paTaperStart:100000,paTaperEnd:125140,
 basicRateBand:37700,basicRate:0.20,
 higherRateStart:50270,higherRate:0.40,
 additionalRateStart:125140,additionalRate:0.45,
 scotland:{
 starterRate:0.19,starterTop:14876,
 basicRate:0.20,basicTop:26561,
 intermediateRate:0.21,intermediateTop:43662,
 higherRate:0.42,higherTop:75000,
 advancedRate:0.45,advancedTop:125140,
 topRate:0.48
 },
 niPrimaryThreshold:12570,niUpperEarningsLimit:50270,niMainRate:0.08,niUpperRate:0.02,
 dividendAllowance:500,dividendBasicRate:0.0875,dividendHigherRate:0.3375,dividendAdditionalRate:0.3935,
 cgtAllowance:3000,cgtBasicRate:0.18,cgtHigherRate:0.24,
 savingsAllowanceBasic:1000,savingsAllowanceHigher:500,savingsAllowanceAdditional:0,
 savingsStartingRateBand:5000,
 isaAllowance:20000,lisaAllowance:4000,lisaBonusPct:0.25,juniorIsaAllowance:9000,
 pensionAnnualAllowance:60000,
 pensionAATaperStart:260000,
 pensionThresholdIncome:200000,
 pensionAATaperFloor:10000,
 pensionAATaperRate:0.5,
 pensionCarryForwardYears:3,

let db;const DB_VERSION=2;const STORES=['firms','advisers','clients','scenarios','audit','settings'];
function openDB(){return new Promise((res)=>{
 try{
 const r=indexedDB.open(STORE,DB_VERSION);
 r.onupgradeneeded=e=>{const d=e.target.result;for(const s of STORES){if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:s==='settings'?undefined:'id'})}};
 r.onsuccess=e=>{db=e.target.result;res(db)};
 r.onerror=()=>{db=null;res(null)};
 }catch(e){db=null;res(null)}
})}
function idbPut(store,rec,key){return new Promise((res)=>{
 if(!db){lsPut(store,rec,key);return res()}
 try{
 const tx=db.transaction(store,'readwrite');const s=tx.objectStore(store);
 const req=key?s.put(rec,key):s.put(rec);
 tx.oncomplete=()=>res();tx.onerror=()=>{lsPut(store,rec,key);res()};
 }catch(e){lsPut(store,rec,key);res()}
})}
function idbGet(store,key){return new Promise((res)=>{
 if(!db){return res(lsGet(store,key))}
 try{
 const tx=db.transaction(store,'readonly');const req=tx.objectStore(store).get(key);
 req.onsuccess=()=>res(req.result);req.onerror=()=>res(lsGet(store,key));
 }catch(e){res(lsGet(store,key))}
})}
function idbAll(store){return new Promise((res)=>{
 if(!db){return res(lsAll(store))}
 try{
 const tx=db.transaction(store,'readonly');const req=tx.objectStore(store).getAll();
 req.onsuccess=()=>res(req.result||[]);req.onerror=()=>res(lsAll(store));
 }catch(e){res(lsAll(store))}
})}
function idbDel(store,key){return new Promise((res)=>{
 if(!db){lsDel(store,key);return res()}
 try{
 const tx=db.transaction(store,'readwrite');const req=tx.objectStore(store).delete(key);
 tx.oncomplete=()=>res();tx.onerror=()=>{lsDel(store,key);res()};
 }catch(e){lsDel(store,key);res()}
})}
const LSKEY=k=>STORE+'::'+k;
function lsPut(s,r,k){try{const all=JSON.parse(localStorage.getItem(LSKEY(s))||'{}');all[k||r.id]=r;localStorage.setItem(LSKEY(s),JSON.stringify(all))}catch(e){}}
function lsGet(s,k){try{const all=JSON.parse(localStorage.getItem(LSKEY(s))||'{}');return all[k]}catch(e){return null}}
function lsAll(s){try{return Object.values(JSON.parse(localStorage.getItem(LSKEY(s))||'{}'))}catch(e){return[]}}
function lsDel(s,k){try{const all=JSON.parse(localStorage.getItem(LSKEY(s))||'{}');delete all[k];localStorage.setItem(LSKEY(s),JSON.stringify(all))}catch(e){}}

const broadcastTimers={};
function broadcast(type,payload){try{chClient&&chClient.postMessage({v:1,type,ts:Date.now(),source:TOOLNAME,payload})}catch(e){}}
function broadcastDebounced(type,payload){

async function handleMeshMessage(m){
 if(!m||m.source===TOOLNAME)return;
 try{
 if(m.type==='sync.request'){
 broadcast('sync.snapshot',{clients:state.clients,advisers:state.advisers,firm:state.firm});
 }else if(m.type==='sync.snapshot'){
 const p=m.payload||{};
 if(p.firm&&(!state.firm||(p.firm.updatedAt||0)>(state.firm.updatedAt||0))){state.firm=p.firm;await idbPut('firms',p.firm)}
 for(const a of(p.advisers||[])){const local=state.advisers.find(x=>x.id===a.id);if(!local||(a.updatedAt||0)>(local.updatedAt||0)){await saveAdviser(a,'sync from '+m.source,true)}}
 for(const c of(p.clients||[])){const local=state.clients.find(x=>x.id===c.id);if(!local||(c.updatedAt||0)>(local.updatedAt||0)){await saveClient(c,'sync from '+m.source,true)}}
 render();
 }else if(m.type==='client.created'||m.type==='client.updated'){
 const c=m.payload;if(!c||!c.id)return;
 const local=state.clients.find(x=>x.id===c.id);
 if(!local||(c.updatedAt||0)>(local.updatedAt||0)){await saveClient(c,'mesh '+m.type+' from '+m.source,true);render()}
 }else if(m.type==='client.archived'){
 const c=m.payload;if(!c||!c.id)return;
 const local=state.clients.find(x=>x.id===c.id);
 if(local){local.archivedAt=c.archivedAt;await idbPut('clients',local);render()}
 }else if(m.type==='adviser.created'||m.type==='adviser.updated'){
 const a=m.payload;if(!a||!a.id)return;
 const local=state.advisers.find(x=>x.id===a.id);
 if(!local||(a.updatedAt||0)>(local.updatedAt||0)){await saveAdviser(a,'mesh '+m.type+' from '+m.source,true);render()}
 }else if(m.type==='firm.updated'){
 const f=m.payload;if(!f)return;
 if(!state.firm||(f.updatedAt||0)>(state.firm.updatedAt||0)){state.firm=f;await idbPut('firms',f);render()}
 }
 }catch(e){console.warn('mesh handler error',e)}
}
function initMesh(){

 });

}

// TAX ENGINES · UK 2025-26 · T0 deterministic
// England/Wales/NI + Scotland income tax
// NI · Dividend · CGT · Savings (PSA + starting rate band)
// Marriage allowance · HICBC · Tapered AA + carry-forward
// IHT + BPR/APR (post-2026 reform cap)
// ════════════════════════════════════════════════════════════════

function adjustedPersonalAllowance(income){
 const over=Math.max(0,income-RULES.paTaperStart);
 return Math.max(0,RULES.personalAllowance-Math.floor(over/2));
}

function incomeTaxEngland(income,paAdj){
 const pa=paAdj==null?adjustedPersonalAllowance(income):paAdj;
 let remaining=Math.max(0,income-pa);
 const bands=[];let tax=0;
 const basic=Math.min(remaining,RULES.basicRateBand);
 if(basic>0){tax+=basic*RULES.basicRate;bands.push({label:'Basic 20%',rate:RULES.basicRate,amount:basic,tax:basic*RULES.basicRate});remaining-=basic}
 const higherBandSize=RULES.additionalRateStart-RULES.higherRateStart;
 const higher=Math.min(remaining,higherBandSize);
 if(higher>0){tax+=higher*RULES.higherRate;bands.push({label:'Higher 40%',rate:RULES.higherRate,amount:higher,tax:higher*RULES.higherRate});remaining-=higher}
 if(remaining>0){tax+=remaining*RULES.additionalRate;bands.push({label:'Additional 45%',rate:RULES.additionalRate,amount:remaining,tax:remaining*RULES.additionalRate})}
 let marginalRate=0;
 if(income<=pa)marginalRate=0;
 else if(income<=RULES.higherRateStart)marginalRate=RULES.basicRate;
 else if(income<=RULES.additionalRateStart)marginalRate=RULES.higherRate;
 else marginalRate=RULES.additionalRate;
 if(income>RULES.paTaperStart&&income<=RULES.paTaperEnd)marginalRate=0.60;
 return{tax,bands,paUsed:pa,marginalRate};
}

function incomeTaxScotland(income,paAdj){
 const pa=paAdj==null?adjustedPersonalAllowance(income):paAdj;
 const S=RULES.scotland;
 let remaining=Math.max(0,income-pa);
 const bands=[];let tax=0;
 // bands above PA (sizes)
 const starter=Math.min(remaining,S.starterTop-RULES.personalAllowance);
 if(starter>0){tax+=starter*S.starterRate;bands.push({label:'Starter 19%',rate:S.starterRate,amount:starter,tax:starter*S.starterRate});remaining-=starter}
 const basic=Math.min(remaining,S.basicTop-S.starterTop);
 if(basic>0){tax+=basic*S.basicRate;bands.push({label:'Basic 20%',rate:S.basicRate,amount:basic,tax:basic*S.basicRate});remaining-=basic}
 const inter=Math.min(remaining,S.intermediateTop-S.basicTop);
 if(inter>0){tax+=inter*S.intermediateRate;bands.push({label:'Intermediate 21%',rate:S.intermediateRate,amount:inter,tax:inter*S.intermediateRate});remaining-=inter}
 const higher=Math.min(remaining,S.higherTop-S.intermediateTop);
 if(higher>0){tax+=higher*S.higherRate;bands.push({label:'Higher 42%',rate:S.higherRate,amount:higher,tax:higher*S.higherRate});remaining-=higher}
 const adv=Math.min(remaining,S.advancedTop-S.higherTop);
 if(adv>0){tax+=adv*S.advancedRate;bands.push({label:'Advanced 45%',rate:S.advancedRate,amount:adv,tax:adv*S.advancedRate});remaining-=adv}
 if(remaining>0){tax+=remaining*S.topRate;bands.push({label:'Top 48%',rate:S.topRate,amount:remaining,tax:remaining*S.topRate})}
 let marginalRate=0;
 if(income<=pa)marginalRate=0;
 else if(income<=S.starterTop)marginalRate=S.starterRate;
 else if(income<=S.basicTop)marginalRate=S.basicRate;
 else if(income<=S.intermediateTop)marginalRate=S.intermediateRate;
 else if(income<=S.higherTop)marginalRate=S.higherRate;
 else if(income<=S.advancedTop)marginalRate=S.advancedRate;
 else marginalRate=S.topRate;
 if(income>RULES.paTaperStart&&income<=RULES.paTaperEnd){
 // Scotland PA taper creates ~63% effective at higher band, simplified marker
 marginalRate=Math.max(marginalRate,0.63);
 }
 return{tax,bands,paUsed:pa,marginalRate};
}

function incomeTax(income,region,paAdj){
 if(region==='Scotland')return incomeTaxScotland(income,paAdj);
 return incomeTaxEngland(income,paAdj);
}

function nationalInsurance(income){
 let ni=0;
 const main=Math.max(0,Math.min(income,RULES.niUpperEarningsLimit)-RULES.niPrimaryThreshold);
 ni+=main*RULES.niMainRate;
 const upper=Math.max(0,income-RULES.niUpperEarningsLimit);
 ni+=upper*RULES.niUpperRate;
 return{ni,mainAmount:main,upperAmount:upper};
}

function savingsTax(savingsInterest,salaryIncome,region){
 if(!savingsInterest)return{tax:0,bands:[],allowance:0,startingBand:0};
 // PSA depends on highest tax band reached by non-savings income (excl Scotland for PSA purposes — UK-wide tests still apply)
 // Simplified: use marginal band from non-savings income
 const it=incomeTax(salaryIncome,region);
 let psa=0;
 if(it.marginalRate<=0.20||salaryIncome<=RULES.higherRateStart)psa=RULES.savingsAllowanceBasic;
 else if(salaryIncome<=RULES.additionalRateStart)psa=RULES.savingsAllowanceHigher;
 else psa=RULES.savingsAllowanceAdditional;
 // Starting rate band: 0% on up to £5,000 of savings, tapered £1 per £1 by non-savings income above PA
 const pa=adjustedPersonalAllowance(salaryIncome);
 const nonSavTaxable=Math.max(0,salaryIncome-pa);
 const startingBand=Math.max(0,RULES.savingsStartingRateBand-nonSavTaxable);
 let taxable=Math.max(0,savingsInterest-startingBand-psa);
 let tax=0;const bands=[];
 if(startingBand>0)bands.push({label:'Starting rate 0%',amount:Math.min(savingsInterest,startingBand),tax:0});
 if(psa>0)bands.push({label:'PSA 0%',amount:Math.min(Math.max(0,savingsInterest-startingBand),psa),tax:0});
 if(taxable>0){
 // savings stacks on top of non-savings, taxed at income-tax rates of stacked position
 // simplified: tax at marginal rate of (salary + savings)
 const stacked=incomeTax(salaryIncome+taxable,region);
 const baseline=incomeTax(salaryIncome,region);
 tax=Math.max(0,stacked.tax-baseline.tax);
 bands.push({label:'Savings @ marginal',amount:taxable,tax});
 }
 return{tax,bands,allowance:psa,startingBand};
}

function dividendTax(dividend,salaryIncome,region){
 if(!dividend)return{tax:0,bands:[]};
 let taxable=Math.max(0,dividend-RULES.dividendAllowance);
 const pa=adjustedPersonalAllowance(salaryIncome+dividend);
 const taxableSalary=Math.max(0,salaryIncome-pa);
 // dividend tax uses UK-wide bands even for Scottish taxpayers (savings & dividends are reserved)
 const basicBandUsed=Math.min(taxableSalary,RULES.basicRateBand);
 const basicBandLeft=Math.max(0,RULES.basicRateBand-basicBandUsed);
 let tax=0;const bands=[];
 const inBasic=Math.min(taxable,basicBandLeft);
 if(inBasic>0){tax+=inBasic*RULES.dividendBasicRate;bands.push({label:'Div basic 8.75%',amount:inBasic,tax:inBasic*RULES.dividendBasicRate});taxable-=inBasic}
 const higherBandSize=RULES.additionalRateStart-RULES.higherRateStart;
 const inHigher=Math.min(taxable,higherBandSize);
 if(inHigher>0){tax+=inHigher*RULES.dividendHigherRate;bands.push({label:'Div higher 33.75%',amount:inHigher,tax:inHigher*RULES.dividendHigherRate});taxable-=inHigher}
 if(taxable>0){tax+=taxable*RULES.dividendAdditionalRate;bands.push({label:'Div additional 39.35%',amount:taxable,tax:taxable*RULES.dividendAdditionalRate})}
 return{tax,bands};
}

function capitalGainsTax(realisedGain,salaryIncome){
 if(realisedGain<=0)return{tax:0,bands:[]};
 const taxable=Math.max(0,realisedGain-RULES.cgtAllowance);
 if(taxable<=0)return{tax:0,bands:[{label:'Within £'+RULES.cgtAllowance+' allowance',amount:realisedGain,tax:0}]};
 const pa=adjustedPersonalAllowance(salaryIncome);
 const taxableSalary=Math.max(0,salaryIncome-pa);
 const basicLeft=Math.max(0,RULES.basicRateBand-Math.min(taxableSalary,RULES.basicRateBand));
 let tax=0;const bands=[];
 const inBasic=Math.min(taxable,basicLeft);
 if(inBasic>0){tax+=inBasic*RULES.cgtBasicRate;bands.push({label:'CGT basic 18%',amount:inBasic,tax:inBasic*RULES.cgtBasicRate})}
 const inHigher=taxable-inBasic;
 if(inHigher>0){tax+=inHigher*RULES.cgtHigherRate;bands.push({label:'CGT higher 24%',amount:inHigher,tax:inHigher*RULES.cgtHigherRate})}
 return{tax,bands};
}

// MARRIAGE ALLOWANCE
function marriageAllowanceImpact(c){
 if(!c)return{eligible:false,impact:0,direction:'none'};
 const f=c.financials||{};
 if(!f.marriageAllowanceClaimed)return{eligible:false,impact:0,direction:f.marriageAllowanceDirection||'none'};
 if(f.marriageAllowanceDirection==='receiving'){
 // recipient: gets £1,260 extra PA equivalent → saves up to £252 (£1,260 × 20%)
 return{eligible:true,impact:RULES.marriageAllowance*RULES.basicRate,direction:'receiving',adjustedPA:adjustedPersonalAllowance(f.income)+RULES.marriageAllowance};
 }
 if(f.marriageAllowanceDirection==='transferring'){
 // transferor: loses £1,260 of PA — costs nothing if income < (PA - 1260)
 return{eligible:true,impact:-RULES.marriageAllowance*RULES.basicRate,direction:'transferring',adjustedPA:Math.max(0,adjustedPersonalAllowance(f.income)-RULES.marriageAllowance)};
 }
 return{eligible:false,impact:0,direction:'none'};
}

// HICBC · post-2024 taper £60k-£80k, 1% per £200 over £60k
function hicbcCharge(c){
 if(!c)return{charge:0,childBenefit:0,adjustedNetIncome:0};
 const f=c.financials||{};
 const cb=+f.childBenefitClaimed||0;
 const ani=adjustedNetIncome(c);
 if(ani<=RULES.hicbcStart)return{charge:0,childBenefit:cb,adjustedNetIncome:ani};
 if(ani>=RULES.hicbcEnd)return{charge:cb,childBenefit:cb,adjustedNetIncome:ani};
 const over=ani-RULES.hicbcStart;
 const chargePct=Math.min(1,Math.floor(over/200)*RULES.hicbcRatePer200);
 return{charge:cb*chargePct,childBenefit:cb,adjustedNetIncome:ani,chargePct};
}

// Adjusted Net Income (used by PA taper, HICBC) = total taxable income less grossed-up pension contribs and gift aid
function adjustedNetIncome(c){
 if(!c)return 0;
 const f=c.financials||{};
 if(f.adjustedNetIncomeManualOverride!=null)return +f.adjustedNetIncomeManualOverride;
 const total=(+f.income||0)+(+f.dividendIncome||0)+(+f.savingsInterest||0)+(+f.rentalIncome||0);
 // gross relief-at-source personal pension (SIPP) deducted
 const sipp=(+(c.contribs&&c.contribs.sippThisYear)||0);
 const sippGross=sipp/0.80; // basic-rate gross-up
 // salary sacrifice & workplace via net pay already reduce gross pay reported as income; no further deduction
 return Math.max(0,total-sippGross);
}

// Threshold income (pension AA tapering)
function thresholdIncome(c){
 if(!c)return 0;
 const f=c.financials||{};
 if(f.thresholdIncomeManualOverride!=null)return +f.thresholdIncomeManualOverride;
 const total=(+f.income||0)+(+f.dividendIncome||0)+(+f.savingsInterest||0)+(+f.rentalIncome||0);
 // exclude employer contribs (would be added back to make adjusted income)
 const personalContribs=(+(c.contribs&&c.contribs.sippThisYear)||0)/0.80+(+(c.contribs&&c.contribs.salarySacrifice)||0);
 return Math.max(0,total-personalContribs);
}

// Adjusted income (pension AA tapering) = threshold + all pension contribs (incl employer)
function adjustedIncomeForAA(c){
 if(!c)return 0;
 const f=c.financials||{};
 const ti=thresholdIncome(c);
 const employer=(+f.income||0)*(+f.employerContribPct||0);
 const personalContribs=(+(c.contribs&&c.contribs.sippThisYear)||0)/0.80+(+(c.contribs&&c.contribs.salarySacrifice)||0)+(+(c.contribs&&c.contribs.workplacePensionAnnual)||0);
 return ti+employer+personalContribs;
}

// TAPERED ANNUAL ALLOWANCE
function taperedAA(c){
 if(!c)return{aa:RULES.pensionAnnualAllowance,tapered:false,thresholdIncome:0,adjustedIncome:0};
 const ti=thresholdIncome(c);
 const ai=adjustedIncomeForAA(c);
 if(ti<=RULES.pensionThresholdIncome)return{aa:RULES.pensionAnnualAllowance,tapered:false,thresholdIncome:ti,adjustedIncome:ai};
 if(ai<=RULES.pensionAATaperStart)return{aa:RULES.pensionAnnualAllowance,tapered:false,thresholdIncome:ti,adjustedIncome:ai};
 const reduction=Math.floor((ai-RULES.pensionAATaperStart)/2);
 const aa=Math.max(RULES.pensionAATaperFloor,RULES.pensionAnnualAllowance-reduction);
 return{aa,tapered:true,thresholdIncome:ti,adjustedIncome:ai,reduction};
}

// CARRY-FORWARD AA
function carryForwardAA(c){
 if(!c)return{available:0,years:[0,0,0],current:RULES.pensionAnnualAllowance};
 const f=c.financials||{};
 const years=(f.carryForward||[0,0,0]).slice(0,3);
 const available=years.reduce((s,x)=>s+(+x||0),0);
 const t=taperedAA(c);
 return{available,years,current:t.aa,tapered:t.tapered};
}

// IHT · with BPR/APR post-2026 cap
function ihtEstimate(c){
 if(!c)return{net:0,nrb:0,rnrb:0,bprRelief:0,aprRelief:0,taxable:0,tax:0};
 const f=c.financials||{};
 const totalAssets=(+f.mainHomeValue||0)+(+f.otherAssets||0)+(+f.bprAssets||0)+(+f.aprAssets||0)-(+f.liabilities||0)+(+f.giftsLast7Years||0);
 // BPR/APR combined cap (post-2026 reform): 100% on first £1m, 50% on excess
 const bprAprCombined=(+f.bprAssets||0)+(+f.aprAssets||0);
 let bprAprRelief=0;
 if(bprAprCombined>0){
 const fullRelief=Math.min(bprAprCombined,RULES.bprAprCap);
 const partialRelief=Math.max(0,bprAprCombined-RULES.bprAprCap)*RULES.bprAprAboveCapRate;
 bprAprRelief=fullRelief+partialRelief;
 }
 const nrb=RULES.ihtNilRateBand;
 const rnrb=(+f.mainHomeValue||0)>0?RULES.ihtResidenceNilRateBand:0;
 const taxable=Math.max(0,totalAssets-bprAprRelief-nrb-rnrb);
 const tax=taxable*RULES.ihtRate;
 return{net:totalAssets,nrb,rnrb,bprRelief:Math.min(bprAprRelief,+f.bprAssets||0),aprRelief:Math.max(0,bprAprRelief-(+f.bprAssets||0)),bprAprRelief,taxable,tax};
}

function totalTaxFor(c){
 if(!c)return{incomeTax:0,bands:[],paUsed:0,marginalRate:0,ni:0,dividendTax:0,cgt:0,savingsTax:0,grossIncome:0,totalLiability:0,effectiveRate:0,region:'England',hicbc:0,marriageAllowance:0};
 const f=c.financials||{};
 const region=clientRegion(c);
 const ma=marriageAllowanceImpact(c);
 const paAdj=ma.adjustedPA!=null?ma.adjustedPA:adjustedPersonalAllowance(+f.income||0);
 const it=incomeTax(+f.income||0,region,paAdj);
 const ni=nationalInsurance(+f.income||0);
 const dt=dividendTax(+f.dividendIncome||0,+f.income||0,region);
 const st=savingsTax(+f.savingsInterest||0,+f.income||0,region);
 const ct=capitalGainsTax((c.gains&&c.gains.cgtRealisedThisYear)||0,+f.income||0);
 const hi=hicbcCharge(c);
 const maImpact=ma.eligible?(ma.direction==='receiving'?-RULES.marriageAllowance*RULES.basicRate:0):0;
 const totalLiability=it.tax+ni.ni+dt.tax+ct.tax+st.tax+(hi.charge||0)+maImpact;
 const grossIncome=(+f.income||0)+(+f.dividendIncome||0)+(+f.savingsInterest||0)+(+f.rentalIncome||0)+((c.gains&&c.gains.cgtRealisedThisYear)||0);
 return{
 incomeTax:it.tax,bands:it.bands,paUsed:it.paUsed,marginalRate:it.marginalRate,
 ni:ni.ni,dividendTax:dt.tax,cgt:ct.tax,savingsTax:st.tax,savingsBands:st.bands,psa:st.allowance,startingBand:st.startingBand,
 grossIncome,totalLiability,
 effectiveRate:grossIncome>0?totalLiability/grossIncome:0,
 region,hicbc:hi.charge||0,hicbcDetails:hi,
 marriageAllowance:maImpact,marriageAllowanceDetails:ma
 };
}

// PENSION PROJECTION
// ════════════════════════════════════════════════════════════════
function pensionProjection(currentPot,annualContrib,years,growthRate){
 const r=growthRate;
 if(years<=0)return currentPot;
 const fvPot=currentPot*Math.pow(1+r,years);
 const fvContribs=annualContrib*((Math.pow(1+r,years)-1)/r);
 return fvPot+fvContribs;
}
function annuityIncomeFromPot(pot,annuityRate){return pot*(annuityRate||0.06)}
function drawdownYears(pot,annualWithdrawal,growthRate){
 let years=0,bal=pot,r=growthRate||0.04;
 while(bal>0&&years<60){bal=bal*(1+r)-annualWithdrawal;years++;if(bal<=0)break}
 return years;
}

const ASSET_CLASSES={
 cash:{label:'Cash',risk:0,bucket:'cash'},

 equity:{label:'Equity / Shares',risk:3,bucket:'eq'},
 fund:{label:'Fund / ETF',risk:2,bucket:'eq'},
 reit:{label:'REIT / Property',risk:2,bucket:'eq'},
 commodity:{label:'Commodity / Gold',risk:2,bucket:'alt'},
 crypto:{label:'Crypto',risk:5,bucket:'alt'},
 pension:{label:'Pension (untyped)',risk:2,bucket:'eq'},
 alt:{label:'Alternatives',risk:3,bucket:'alt'},
 other:{label:'Other',risk:2,bucket:'alt'}
};
const TAX_WRAPPERS={
 isa_ss:{label:'S&S ISA',isa:true},
 isa_cash:{label:'Cash ISA',isa:true},
 isa_lisa:{label:'LISA',isa:true,lisa:true},
 isa_if:{label:'IFISA',isa:true},
 sipp:{label:'SIPP',pension:true},
 workplace:{label:'Workplace pension',pension:true},
 gia:{label:'GIA (taxable)',taxable:true},
 premium:{label:'Premium Bonds',taxable:false},

 trust:{label:'Trust',taxable:true},

};

function portfolioAnalysisFor(c){
 if(!c)return{total:0,byClass:{},byWrapper:{},riskScore:0,eq:0,bond:0,cash:0,alt:0,concentration:[],target:RULES.atrAllocations[4],holdings:[]};
 const h=(c.holdings||[]);
 const total=h.reduce((s,x)=>s+(+x.value||0),0);
 const atr=(c.suitability&&c.suitability.attitudeToRisk)||4;
 const target=RULES.atrAllocations[atr]||RULES.atrAllocations[4];
 if(!total)return{total:0,byClass:{},byWrapper:{},riskScore:0,eq:0,bond:0,cash:0,alt:0,concentration:[],target,holdings:h};
 const byClass={},byWrapper={};let riskWeighted=0;
 for(const x of h){
 const v=+x.value||0;
 byClass[x.assetClass]=(byClass[x.assetClass]||0)+v;
 byWrapper[x.taxWrapper]=(byWrapper[x.taxWrapper]||0)+v;
 riskWeighted+=v*((ASSET_CLASSES[x.assetClass]&&ASSET_CLASSES[x.assetClass].risk)||2);
 }
 const riskScore=total>0?riskWeighted/total:0;
 let eq=0,bond=0,cash=0,alt=0;
 for(const k of Object.keys(byClass)){
 const b=(ASSET_CLASSES[k]&&ASSET_CLASSES[k].bucket)||'alt';
 if(b==='eq')eq+=byClass[k];
 else if(b==='bond')bond+=byClass[k];
 else if(b==='cash')cash+=byClass[k];
 else alt+=byClass[k];
 }
 const concentration=h.filter(x=>(+x.value||0)/total>0.10).map(x=>({label:x.label,pct:(+x.value||0)/total,id:x.id}));
 return{total,byClass,byWrapper,riskScore,eq:eq/total,bond:bond/total,cash:cash/total,alt:alt/total,concentration,target,holdings:h};
}

// CGT LOT TRACKING · FIFO matching on disposal
function disposeFIFO(holding,unitsSold,salePricePerUnit){
 if(!holding.lots||!holding.lots.length)return{matched:[],remaining:unitsSold,realisedGain:0};
 const matched=[];let remaining=unitsSold;let realisedGain=0;
 const sorted=holding.lots.slice().sort((a,b)=>new Date(a.date)-new Date(b.date));
 for(let i=0;i<sorted.length&&remaining>0;i++){
 const lot=sorted[i];
 const take=Math.min(remaining,+lot.units||0);
 if(take<=0)continue;
 const costPerUnit=lot.units>0?(+lot.costBasis||0)/(+lot.units||1):0;
 const proceeds=take*salePricePerUnit;
 const costMatched=take*costPerUnit;
 const gain=proceeds-costMatched;
 realisedGain+=gain;
 matched.push({lotDate:lot.date,units:take,costMatched,proceeds,gain});
 lot.units=(+lot.units||0)-take;
 lot.costBasis=(+lot.costBasis||0)-costMatched;
 remaining-=take;
 }
 // remove fully-disposed lots
 holding.lots=holding.lots.filter(l=>(+l.units||0)>0.0001);
 return{matched,remaining,realisedGain};
}

// BED & ISA SUGGESTIONS
function bedAndIsaSuggestions(c){
 if(!c)return[];
 const out=[];
 const isaUsed=(+(c.contribs&&c.contribs.isaThisYear)||0)+(+(c.contribs&&c.contribs.lisaThisYear)||0);
 let isaHeadroom=RULES.isaAllowance-isaUsed;
 const cgtUsed=(c.gains&&c.gains.cgtRealisedThisYear)||0;
 let cgtHeadroom=RULES.cgtAllowance-cgtUsed;
 for(const h of(c.holdings||[])){
 if(!TAX_WRAPPERS[h.taxWrapper]||!TAX_WRAPPERS[h.taxWrapper].taxable)continue;
 const value=+h.value||0;
 const cost=+h.costBasis||0;
 const gain=value-cost;
 if(gain<=0||value<=100)continue;
 const moveAmount=Math.min(value,isaHeadroom);
 if(moveAmount<=0)break;
 // gain on portion moved (proportional)
 const moveGain=value>0?gain*(moveAmount/value):0;
 const cgtImpact=moveGain<=cgtHeadroom?0:Math.max(0,(moveGain-cgtHeadroom)*0.18);
 out.push({
 holding:h.label,holdingId:h.id,
 moveAmount,moveGain,
 cgtImpact,
 usesAllowance:Math.min(moveGain,cgtHeadroom),
 remainingIsaAfter:isaHeadroom-moveAmount,
 note:cgtImpact===0?'Fully within CGT allowance — clean shelter.':'Partially over CGT allowance — '+money(cgtImpact)+' CGT may apply.'
 });
 isaHeadroom-=moveAmount;
 cgtHeadroom=Math.max(0,cgtHeadroom-moveGain);
 if(isaHeadroom<=0)break;
 }
 return out;
}

// TAX-AWARE WITHDRAWAL SEQUENCING
function withdrawalSequence(c,annualRequired){
 if(!c||!annualRequired)return{steps:[],totalFromTax:0,note:''};
 const f=c.financials||{};
 const region=clientRegion(c);
 const h=c.holdings||[];
 // collect per-wrapper balances
 const wrapperBal={};
 for(const x of h){wrapperBal[x.taxWrapper]=(wrapperBal[x.taxWrapper]||0)+(+x.value||0)}
 const isaBal=(wrapperBal.isa_ss||0)+(wrapperBal.isa_cash||0)+(wrapperBal.isa_if||0)+(wrapperBal.isa_lisa||0);
 const sippBal=(wrapperBal.sipp||0)+(wrapperBal.workplace||0);
 const giaBal=wrapperBal.gia||0;
 const cashBal=(wrapperBal.bank||0)+(wrapperBal.premium||0);
 // suggestion order: cash → ISA → SIPP 25% TFC → GIA (within CGT allowance) → SIPP taxable
 let need=annualRequired;
 const steps=[];
 const takeFrom=(name,bal,note,taxRate)=>{
 if(need<=0||bal<=0)return;
 const take=Math.min(bal,need);
 const tax=take*(taxRate||0);
 steps.push({source:name,gross:take,tax,net:take-tax,note});
 need-=(take-tax);
 };
 takeFrom('Cash / Bank',cashBal,'No tax · zero-cost first');
 takeFrom('ISA (all wrappers)',isaBal,'Tax-free withdrawal · preserve allowance shelter as long as possible? Adviser judgement.');
 const tfc=sippBal*0.25;
 takeFrom('SIPP · 25% tax-free cash',tfc,'TFC up to LSA £'+fmt(RULES.lumpSumAllowance));
 // GIA (only within CGT allowance — assume disposal yields gains ≤ allowance)
 takeFrom('GIA (within CGT allowance)',Math.min(giaBal,RULES.cgtAllowance*5),'Use £'+fmt(RULES.cgtAllowance)+' CGT allowance · harvest losses where possible');
 // SIPP taxable at marginal rate of *income* of (state pension + drawdown)
 const sippRemaining=Math.max(0,sippBal-tfc);
 // estimate marginal rate at retirement = current marginal if no override
 const estMarg=incomeTax((+f.income||0)*0.6,region).marginalRate;
 takeFrom('SIPP · taxable drawdown',sippRemaining,'Taxed at retirement marginal rate (est. '+pct(estMarg)+')',estMarg);
 takeFrom('GIA · remainder',giaBal,'Above CGT allowance — taxed at 18/24%',0.20);
 const totalFromTax=steps.reduce((s,x)=>s+(x.tax||0),0);
 return{steps,totalFromTax,unmet:Math.max(0,need),note:need>0?('Funds short by '+money(need)+' for the year.'):''};
}

// SUITABILITY · ATR questionnaire
// ════════════════════════════════════════════════════════════════
const ATR_QUESTIONS=[
 {q:'I would describe myself as a financial risk-taker.',w:1},
 {q:'I am comfortable seeing my investment fall 20% in value over a year if it has the potential to recover and grow more later.',w:1},
 {q:'I prefer safety of capital over higher potential returns.',w:-1},
 {q:'I have invested in equities or equity funds in the past and was comfortable with the experience.',w:1},
 {q:'A short-term loss would cause me significant stress.',w:-1},
 {q:'I am willing to accept fluctuations in the value of my investments to achieve long-term growth.',w:1},
 {q:'If my portfolio fell 30% in a year, I would sell to prevent further losses.',w:-1},
 {q:'I understand that higher returns generally require taking on greater risk.',w:1},
 {q:'I would be uncomfortable holding investments that might lose any money.',w:-1},
 {q:'I have a long time horizon and can ride out market volatility.',w:1}
];

function scoreATR(answers){
 // answers: array of 1-5 (Strongly disagree → Strongly agree)
 if(!answers||answers.length<10)return null;
 let raw=0,maxRaw=0;
 for(let i=0;i<ATR_QUESTIONS.length;i++){
 const ans=+answers[i]||3;
 const w=ATR_QUESTIONS[i].w;
 // normalise: agree (5) with positive w gives +2, disagree (1) gives -2
 const score=(ans-3)*w;
 raw+=score;
 maxRaw+=2;
 }
 // raw in [-maxRaw, +maxRaw] → map to 1-7
 const norm=(raw+maxRaw)/(2*maxRaw); // 0..1
 const atr=Math.max(1,Math.min(7,Math.round(1+norm*6)));
 return atr;
}

 out.push({prio:'high',title:'60% effective tax trap · '+money(into)+' in taper zone',why:'Pension contribution dropping adjusted income below £100k recovers full PA. Effective benefit ~60%.'});
 }
 // Marriage allowance
 if(!f.marriageAllowanceClaimed&&(f.income||0)<RULES.personalAllowance&&(f.relationships||[]).length===0){
 // suggest if income below PA
 out.push({prio:'med',title:'Marriage allowance transfer · save spouse £252/yr',why:'Income '+money(f.income)+' is below £'+fmt(RULES.personalAllowance)+'. Transfer £'+fmt(RULES.marriageAllowance)+' of unused PA to basic-rate spouse.'});
 }
 // HICBC
 const hi=hicbcCharge(c);
 if(hi.charge>0){
 out.push({prio:'high',title:'HICBC clawback · '+money(hi.charge)+' on child benefit',why:'Adjusted net income £'+fmt(hi.adjustedNetIncome)+' triggers '+(pct(hi.chargePct||0))+' clawback. Pension contribution reducing ANI to £60k removes the charge entirely.'});
 }
 // Tapered AA
 const taa=taperedAA(c);
 if(taa.tapered){
 out.push({prio:'high',title:'Tapered annual allowance · AA reduced to '+money(taa.aa),why:'Adjusted income £'+fmt(taa.adjustedIncome)+' triggers taper. Contribution above AA charged at marginal rate. Carry-forward may help.'});
 }
 // Carry-forward
 const cf=carryForwardAA(c);
 if(cf.available>0){
 out.push({prio:'med',title:'Carry-forward AA available · '+money(cf.available),why:'Unused AA from prior 3 years can be used if you have current pensionable earnings ≥ contribution. Years: '+cf.years.map((y,i)=>'Y-'+(i+1)+' £'+fmt(y)).join(' · ')});
 }
 // CGT
 const cgtLeft=RULES.cgtAllowance-((c.gains&&c.gains.cgtRealisedThisYear)||0);
 if(cgtLeft>0&&((c.gains&&c.gains.cgtRealisedThisYear)||0)===0)out.push({prio:'low',title:'CGT allowance unused · '+money(RULES.cgtAllowance),why:'Small annual allowance — Bed & ISA on GIA holdings to use it.'});
 // Bed & ISA
 const bi=bedAndIsaSuggestions(c);
 if(bi.length){
 out.push({prio:'med',title:'Bed & ISA opportunity · '+bi.length+' holding'+(bi.length===1?'':'s'),why:bi.slice(0,3).map(x=>x.holding+': move '+money(x.moveAmount)+' (gain '+money(x.moveGain)+', CGT '+money(x.cgtImpact)+')').join(' · ')});
 }
 // Emergency fund
 const efTarget=(f.monthlyExpenses||0)*(f.emergencyFundMonths||6);
 const cashHoldings=(c.holdings||[]).filter(h=>h.assetClass==='cash'||h.taxWrapper==='bank'||h.taxWrapper==='isa_cash').reduce((s,h)=>s+(+h.value||0),0);
 if(cashHoldings<efTarget){
 out.push({prio:efTarget-cashHoldings>5000?'high':'med',title:'Emergency fund short · '+money(cashHoldings)+' of '+money(efTarget),why:(f.emergencyFundMonths||6)+' months essentials at £'+fmt(f.monthlyExpenses||0)+'/mo. Top up before optimising growth.'});
 }
 // Workplace match
 if((f.employerContribPct||0)>0&&(f.income||0)>0){
 const match=f.income*f.employerContribPct;
 out.push({prio:'med',title:'Capture employer match · '+pct(f.employerContribPct)+' = '+money(match)+'/yr',why:'Free money. Always contribute at least to the maximum employer top-up before SIPP.'});
 }
 // Portfolio drift
 const pa=portfolioAnalysisFor(c);
 if(pa.total>1000){
 const target=pa.target;
 const eqGap=pa.eq-target.eq;
 if(Math.abs(eqGap)>0.10){
 out.push({prio:Math.abs(eqGap)>0.20?'med':'low',title:'Portfolio drift · equity '+pct(pa.eq)+' vs target '+pct(target.eq)+' ('+target.label+')',why:'ATR '+((c.suitability&&c.suitability.attitudeToRisk)||4)+' targets '+pct(target.eq)+' equity. Rebalance via new contributions to avoid CGT.'});
 }
 pa.concentration.forEach(x=>{
 if(x.pct>0.20)out.push({prio:'med',title:'Concentration risk · '+x.label+' is '+pct(x.pct)+' of portfolio',why:'Single-position risk above 20% creates portfolio fragility. Consider trimming.'});
 });
 }
 // State pension
 if((f.qualifyingYearsNI||0)<RULES.statePensionQualifyingYears){
 const yearsShort=RULES.statePensionQualifyingYears-(f.qualifyingYearsNI||0);
 const yearlyImpact=RULES.statePensionAnnual*(yearsShort/RULES.statePensionQualifyingYears);
 out.push({prio:'med',title:'State pension short by '+yearsShort+' years · '+money(yearlyImpact)+'/yr at risk',why:'Full state pension needs '+RULES.statePensionQualifyingYears+' qualifying years. Class 3 voluntary NI ~£'+RULES.class3NIcost+'/yr typically pays back in 3-4 retirement years.'});
 }
 // Annual review due
 const rs=reviewStatus(c);
 if(rs==='overdue')out.push({prio:'high',title:'Annual review overdue · '+dateStr(nextReviewDueFor(c)),why:'COBS requires periodic suitability review. Generate a review pack from the Reports tab.'});
 else if(rs==='due-soon')out.push({prio:'med',title:'Annual review due soon · '+dateStr(nextReviewDueFor(c)),why:'Schedule review meeting and prepare pack.'});
 // IHT
 const iht=ihtEstimate(c);
 if(iht.tax>0){
 out.push({prio:'med',title:'IHT exposure · est '+money(iht.tax),why:'Net estate '+money(iht.net)+'. NRB '+money(iht.nrb)+' + RNRB '+money(iht.rnrb)+'. BPR/APR relief '+money(iht.bprAprRelief)+'. Consider gifts, trusts, life cover.'});
 }
 return out.sort((a,b)=>({high:0,med:1,low:2})[a.prio]-({high:0,med:1,low:2})[b.prio]);
}

 if(tier!=='T0'){

 '- HICBC tapered £60k-£80k (post-2024 reform)\n'+

 '- State pension '+money(RULES.statePensionAnnual)+'/yr · 35 NI years\n\n'+
 'Active client context:\n'+ctx+'\n\nBe concrete · cite £ amounts using their numbers · UK terms · short paragraphs · end with "Verify with HMRC or an authorised adviser before acting."';
 const r=await Cascade.generate(sys,q,1400);
 if(r.text)return{src:r.tier,text:r.text};
 }

 'ATR '+((c.suitability&&c.suitability.attitudeToRisk)||4)+' · CFL '+((c.suitability&&c.suitability.capacityForLoss)||'medium')+' · KE '+((c.suitability&&c.suitability.knowledgeExperience)||'medium')+'\n'+
 'Salary '+money(f.income||0)+' · Dividends '+money(f.dividendIncome||0)+' · Savings interest '+money(f.savingsInterest||0)+' · Rental '+money(f.rentalIncome||0)+'\n'+
 'Marginal '+pct(t.marginalRate)+' · effective '+pct(t.effectiveRate)+' · total tax '+money(t.totalLiability)+'\n'+

 'SIPP '+money((c.contribs&&c.contribs.sippThisYear)||0)+' · workplace '+money((c.contribs&&c.contribs.workplacePensionAnnual)||0)+' · salary sacrifice '+money((c.contribs&&c.contribs.salarySacrifice)||0)+'\n'+
 'AA '+money(taa.aa)+(taa.tapered?' (tapered)':'')+' · carry-forward '+money(cf.available)+'\n'+
 'Portfolio '+money(pa.total)+' · '+pct(pa.eq)+' eq / '+pct(pa.bond)+' bond / '+pct(pa.cash)+' cash · risk '+pa.riskScore.toFixed(1)+'/5\n'+

function renderHeader(){
 const c=activeClient();
 $('#cpWho').textContent=c?clientName(c):'— select client —';
 $('#cpMeta').textContent=c?('ATR '+((c.suitability&&c.suitability.attitudeToRisk)||4)+' · '+(c.kyc&&c.kyc.riskGrade||'low').toUpperCase()):'';
 $('#tabNav').innerHTML=TABS.map(t=>'<button class="'+(state.active===t.id?'active':'')+'" onclick="showApp(\''+t.id+'\')"><span style="font-family:var(--serif);font-size:14px;color:var(--brass)">'+t.ico+'</span>'+t.name+'</button>').join('');

function renderSidebar(){
 const f=$('#clientFilter');
 if(f)state.filters.q=f.value;
 const af=$('#clientFilterAdviser');
 if(af){
 const cur=af.value||state.filters.adviser||'';
 af.innerHTML='<option value="">all advisers</option>'+state.advisers.map(a=>'<option value="'+esc(a.id)+'"'+(cur===a.id?' selected':'')+'>'+esc(a.name||'(unnamed)')+'</option>').join('');
 state.filters.adviser=cur;
 }
 const rf=$('#clientFilterRisk');if(rf)state.filters.risk=rf.value;
 const atrf=$('#clientFilterATR');if(atrf)state.filters.atr=atrf.value;
 const df=$('#clientFilterDue');if(df)state.filters.due=df.value;
 const list=state.clients.filter(c=>{
 if(c.archivedAt)return false;
 const q=(state.filters.q||'').toLowerCase();
 if(q&&!(clientName(c).toLowerCase().includes(q)||(c.email||'').toLowerCase().includes(q)||(c.address&&(c.address.postcode||'').toLowerCase().includes(q))))return false;
 if(state.filters.adviser&&c.adviserId!==state.filters.adviser)return false;
 if(state.filters.risk&&c.kyc&&c.kyc.riskGrade!==state.filters.risk)return false;
 if(state.filters.atr&&String((c.suitability&&c.suitability.attitudeToRisk)||4)!==state.filters.atr)return false;
 if(state.filters.due){
 const rs=reviewStatus(c);
 if(state.filters.due==='due'&&!(rs==='overdue'||rs==='due-soon'))return false;
 if(state.filters.due==='ok'&&rs!=='ok')return false;
 }
 return true;
 }).sort((a,b)=>clientName(a).localeCompare(clientName(b)));
 $('#clientCount').textContent=state.clients.filter(c=>!c.archivedAt).length+' total';
 const ul=$('#clientList');
 if(!list.length){
 ul.innerHTML='<div class="empty-state">No clients match the filter.<br><br><button class="btn sm primary" onclick="newClient()">+ add first client</button></div>';
 return;
 }
 ul.innerHTML=list.map(c=>{
 const rs=reviewStatus(c);
 const atr=(c.suitability&&c.suitability.attitudeToRisk)||4;
 const tags=[];
 tags.push('<span class="tag atr">ATR '+atr+'</span>');
 if(c.kyc&&c.kyc.riskGrade){tags.push('<span class="tag">'+esc(c.kyc.riskGrade)+'</span>')}
 if(rs==='overdue'){tags.push('<span class="tag due">review overdue</span>')}
 else if(rs==='due-soon'){tags.push('<span class="tag" style="background:var(--amber);color:var(--void)">review soon</span>')}
 if(c.kyc&&c.kyc.vulnerableCustomerFlag){tags.push('<span class="tag" style="background:var(--amber);color:var(--void)">VC</span>')}
 return '<div class="client-card '+(state.activeClientId===c.id?'active':'')+'" onclick="selectClient(\''+c.id+'\')">'+
 '<div class="nm">'+esc(clientName(c))+'</div>'+
 '<div class="sub">'+tags.join(' ')+'</div></div>';
 }).join('');
}

function confirmArchive(id){

 archiveClient(id).then(()=>{if(state.activeClientId===id)state.activeClientId=null;toast('archived');render()});

 const arch=state.clients.filter(c=>c.archivedAt);
 openModalCustom('Archived clients ('+arch.length+')',

 '<table><tr><th>name</th><th>archived</th><th></th></tr>'+arch.map(c=>'<tr><td>'+esc(clientName(c))+'</td><td>'+dateStr(c.archivedAt)+'</td><td><button class="btn sm" onclick="unarchive(\''+c.id+'\')">restore</button></td></tr>').join('')+'</table>');

async function unarchive(id){

 broadcast('client.updated',c);
 closeModal();render();toast('restored');
}

 const f=c.financials||{};
 const currentPot=(c.holdings||[]).filter(h=>h.taxWrapper==='sipp'||h.taxWrapper==='workplace').reduce((s,h)=>s+(+h.value||0),0);

 };

async function commitDisposal(){
 const c=activeClient();const hi=+$('#d_h').value;const u=+$('#d_u').value||0;const pp=+$('#d_pp').value||0;const dt=$('#d_dt').value;
 if(!u||!pp){toast('units + price required');return}
 const h=c.holdings[hi];
 const res=disposeFIFO(h,u,pp);
 h.value=Math.max(0,(h.value||0)-(u*pp));
 if(!c.gains)c.gains={cgtRealisedThisYear:0,disposals:[]};
 c.gains.cgtRealisedThisYear=(c.gains.cgtRealisedThisYear||0)+res.realisedGain;
 c.gains.disposals.push({date:dt,holdingId:h.id,holdingLabel:h.label,units:u,pricePerUnit:pp,realisedGain:res.realisedGain,matched:res.matched});
 await saveClient(c,'Disposal recorded · FIFO realised £'+res.realisedGain.toFixed(2));
 closeModal();toast('disposal recorded · gain '+money(res.realisedGain));render();
}

function applyScenarioToClient(c,snap){

 c.holdings=snap.holdings||[];

 c.suitability=Object.assign({},c.suitability||{},snap.suitability||{});
 c.address=Object.assign({},c.address||{},snap.address||{});
}

async function presetScenario(kind){
 const c=activeClient();const snap=scenarioSnapshot(c);
 let name='Scenario';
 if(kind==='retire60'){snap.profile.targetRetirementAge=60;name='Retire at 60'}
 else if(kind==='retire67'){snap.profile.targetRetirementAge=67;name='Retire at 67'}
 else if(kind==='retire70'){snap.profile.targetRetirementAge=70;name='Retire at 70'}
 else if(kind==='downsize'){snap.profile.mainHomeValue=Math.max(0,(snap.profile.mainHomeValue||0)-150000);snap.profile.otherAssets=(snap.profile.otherAssets||0)+150000;name='Downsize property (£150k released)'}
 else if(kind==='maxsipp'){const cfTotal=(snap.profile.carryForward||[0,0,0]).reduce((s,x)=>s+x,0);snap.contribs.sippThisYear=Math.min(60000+cfTotal,(snap.profile.income||0));name='Max SIPP with carry-forward'}
 const sc={id:'sc_'+uid(),clientId:c.id,name,createdAt:Date.now(),updatedAt:Date.now(),snapshot:snap};
 await saveScenario(sc,'Preset scenario created · '+kind);
 toast('preset saved');render();
}

 if(!confirm('Replace local firm/advisers/clients/scenarios with imported data? Audit chain preserved.'))return;
 if(d.firm){state.firm=d.firm;await idbPut('firms',d.firm)}
 for(const a of(d.advisers||[])){await saveAdviser(a,'imported',true)}
 for(const c of(d.clients||[])){await saveClient(c,'imported',true)}
 for(const sc of(d.scenarios||[])){await saveScenario(sc,'imported')}
 toast('imported');render();
 }catch(err){alert('invalid JSON: '+err.message)}
 };
 i.click();
}

async function askPalette(q){
 closePalette();
 state.active='qa';
 if(!state.chat)state.chat=[];
 state.chat.push({role:'user',text:q});
 await saveMeta();render();
 $('#chat').innerHTML=renderChat()+'<div class="msg bot"><em style="color:var(--cream-muted)">thinking…</em></div>';
 $('#chat').scrollTop=$('#chat').scrollHeight;
 const ans=await answerQuestion(q);
 state.chat.push({role:'bot',text:ans.text,src:ans.src});
 await saveMeta();if(state.active==='qa'){$('#chat').innerHTML=renderChat();$('#chat').scrollTop=$('#chat').scrollHeight}
}

// ════════════════════════════════════════════════════════════════
// POSTMESSAGE API · for sibling tools + si-didy
// ════════════════════════════════════════════════════════════════
window.addEventListener('message',async e=>{
 const m=e.data;if(!m||m.target!==TOOLNAME||!m.action)return;
 let r=null;
 if(m.action==='ping')r={ok:true,prime:PRIME,version:VERSION,taxYear:TAX_YEAR,firmId:state.firm&&state.firm.id};
 else if(m.action==='ask'&&m.question){const a=await answerQuestion(m.question);r={ok:true,answer:a.text,src:a.src}}
 else if(m.action==='get-client'&&m.clientId){r={ok:true,client:state.clients.find(c=>c.id===m.clientId)||null}}
 else if(m.action==='list-clients')r={ok:true,clients:state.clients.filter(c=>!c.archivedAt)}
 else if(m.action==='list-advisers')r={ok:true,advisers:state.advisers}
 else if(m.action==='get-firm')r={ok:true,firm:state.firm}
 else if(m.action==='get-tax'&&m.clientId){const c=state.clients.find(x=>x.id===m.clientId);r={ok:true,tax:totalTaxFor(c),rules:RULES}}
 else if(m.action==='get-suggestions'&&m.clientId){const c=state.clients.find(x=>x.id===m.clientId);r={ok:true,suggestions:generateSuggestionsFor(c)}}
 else if(m.action==='select-client'&&m.clientId){state.activeClientId=m.clientId;await saveMeta();render();r={ok:true}}
 if(e.source)e.source.postMessage({target:m.source||'*',responseTo:m.action,data:r},'*');
});
